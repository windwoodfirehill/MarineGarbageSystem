server.port=8000
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
algorithm.base-url=${ALGORITHM_BASE_URL:http://127.0.0.1:8001}
app.upload-dir=${UPLOAD_DIR:./data/uploads}

spring.config.import=optional:file:./config/application-local.properties
spring.datasource.url=${MARINE_DB_URL:jdbc:mysql://127.0.0.1:3306/marine_garbage?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${MARINE_DB_USER:root}
spring.datasource.password=${MARINE_DB_PASSWORD:}
spring.sql.init.mode=never
